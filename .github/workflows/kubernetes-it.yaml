name: Kubernetes Integration Test

on:
  push:
    branches: [ "feature/**" ]
  pull_request:
    branches: [ main, "maintenance/*" ]
  workflow_dispatch:

concurrency:
  group: conductor-kubernetes-it-${{ github.ref }}
  cancel-in-progress: true

jobs:

  kubernetes-it:
    name: Kubernetes Integration Test (minikube)
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Start minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker

      - name: Start minikube tunnel (LoadBalancer support)
        run: |
          minikube tunnel &> /tmp/minikube-tunnel.log &
          echo "Started minikube tunnel (pid $!)"

      - name: Run Kubernetes integration tests
        run: mvn -B --no-transfer-progress verify -pl kubernetes -am

      - name: Dump minikube tunnel log on failure
        if: ${{ failure() }}
        run: cat /tmp/minikube-tunnel.log || true