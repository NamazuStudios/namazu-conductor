name: ECS Integration Test

on:
  push:
    branches: [ "feature/**", "bugfix/**" ]
  pull_request:
    branches: [ main, "maintenance/*" ]
  workflow_dispatch:
  workflow_call:

# Not keyed by github.ref: unlike Kubernetes' per-run ephemeral minikube cluster, this test
# deploys a single shared CloudFormation stack (default name conductor-integration-test) into
# one real AWS account, so concurrent runs from different branches would collide. Serialize them
# instead of canceling in-progress runs, since canceling mid-test could leave real AWS resources
# (VPC, ECS tasks, EC2 spot instances) orphaned.
concurrency:
  group: conductor-ecs-it
  cancel-in-progress: false

jobs:

  ecs-it:
    name: ECS Integration Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # StdioBridgeClientIT (which needed a reachable namazu-stdio-bridge container here) is
      # disabled — see https://github.com/NamazuStudios/namazu-conductor/issues/26.

      - name: Run ECS integration tests
        run: mvn -B --no-transfer-progress verify -pl ecs -am
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}