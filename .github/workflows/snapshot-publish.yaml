name: Snapshot Build

on:
  push:
    branches: [ main, "maintenance/*" ]
  workflow_dispatch:

concurrency:
  group: conductor-integration
  cancel-in-progress: false

jobs:

  preflight:
    name: Verify Snapshot Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:

      - name: Cloning the Repository
        uses: actions/checkout@v4

      - name: Get current version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current project version: $VERSION"

      - name: Ensure Snapshot Version
        run: |
          CURRENT="${{ steps.version.outputs.version }}"

          # Exit if NOT a snapshot
          if [[ "$CURRENT" != *-SNAPSHOT ]]; then
            echo "::error::Expected a -SNAPSHOT version, but found '$CURRENT'."
            echo "The main branch must end with -SNAPSHOT before running a release."
            echo "Please bump the version in pom.xml and push before retrying."
            exit 1
          fi

  # Each provider's integration test runs as its own isolated job (separate runner, separate
  # namazu-stdio-bridge container) rather than sequentially inside one mvn command. This makes
  # failures attributable to a specific provider at a glance, and runs the slow, real-cloud
  # EdgeGap/ECS tests concurrently with Kubernetes instead of one after another.
  kubernetes-it:
    name: Kubernetes Integration Test
    needs: preflight
    uses: ./.github/workflows/kubernetes-it.yaml

  edgegap-it:
    name: EdgeGap Integration Test
    needs: preflight
    uses: ./.github/workflows/edgegap-it.yaml
    secrets: inherit

  ecs-it:
    name: ECS Integration Test
    needs: preflight
    uses: ./.github/workflows/ecs-it.yaml
    secrets: inherit

  snapshot:
    needs: [ preflight, kubernetes-it, edgegap-it, ecs-it ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:

      - name: Cloning the Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 and Maven Credentials
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # Correctness is already proven by the kubernetes-it/edgegap-it/ecs-it jobs above, so skip
      # re-running integration tests here — this job just builds and publishes the artifacts.
      - name: Build and Publish Snapshot
        run: mvn -B --no-transfer-progress -Pgithub-publish clean deploy -pl '!:multiplay' -DskipITs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate API documentation
        run: mvn -B --no-transfer-progress dokka:dokka -Pdocs -N

      - name: Publish snapshot docs to GitHub Pages
        run: |
          set -e
          VERSION="${{ needs.preflight.outputs.version }}"
          REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clone gh-pages branch, or create it fresh if it doesn't exist yet
          if git ls-remote --exit-code --heads "$REMOTE_URL" gh-pages > /dev/null 2>&1; then
            git clone --branch gh-pages --depth 1 "$REMOTE_URL" /tmp/gh-pages
          else
            mkdir /tmp/gh-pages
            cd /tmp/gh-pages
            git init
            git remote add origin "$REMOTE_URL"
            git checkout --orphan gh-pages
            cd -
          fi

          # Always overwrite snapshot/ with the latest docs
          rm -rf /tmp/gh-pages/snapshot
          cp -r target/dokka/. /tmp/gh-pages/snapshot/

          cd /tmp/gh-pages
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Snapshot docs for ${VERSION}"
            git push origin gh-pages
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}