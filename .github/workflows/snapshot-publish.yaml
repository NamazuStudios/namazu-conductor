name: Snapshot Build

on:
  push:
    branches: [ main, "maintenance/*" ]
  workflow_dispatch:

concurrency:
  group: conductor-integration
  cancel-in-progress: false

jobs:

  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:

      - name: Cloning the Repository
        uses: actions/checkout@v4

      - name: Get current version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current project version: $VERSION"

      - name: Ensure Snapshot Version
        id: next_version
        run: |

          CURRENT=${{ steps.version.outputs.version }}

          # Exit if NOT a snapshot
          if [[ "$CURRENT" != *-SNAPSHOT ]]; then
            echo "::error::Expected a -SNAPSHOT version, but found '$CURRENT'."
            echo "The main branch must end with -SNAPSHOT before running a release."
            echo "Please bump the version in pom.xml and push before retrying."
            exit 1
          fi

      - name: Set up JDK 21 and Maven Credentials
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build and Publish Snapshot
        run: mvn -B --no-transfer-progress -Pgithub-publish clean deploy -pl '!:multiplay'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EDGEGAP_API_KEY: ${{ secrets.EDGEGAP_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Generate API documentation
        run: mvn -B --no-transfer-progress dokka:dokka -Pdocs -N

      - name: Publish snapshot docs to GitHub Pages
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clone gh-pages branch, or create it fresh if it doesn't exist yet
          if git ls-remote --exit-code --heads "$REMOTE_URL" gh-pages > /dev/null 2>&1; then
            git clone --branch gh-pages --depth 1 "$REMOTE_URL" /tmp/gh-pages
          else
            mkdir /tmp/gh-pages
            cd /tmp/gh-pages
            git init
            git remote add origin "$REMOTE_URL"
            git checkout --orphan gh-pages
            cd -
          fi

          # Always overwrite snapshot/ with the latest docs
          rm -rf /tmp/gh-pages/snapshot
          cp -r target/dokka/. /tmp/gh-pages/snapshot/

          cd /tmp/gh-pages
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Snapshot docs for ${VERSION}"
            git push origin gh-pages
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}