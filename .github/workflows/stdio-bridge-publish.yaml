name: Publish namazu-stdio-bridge

on:
  push:
    branches: [ main ]
    paths:
      - 'stdio-bridge/**'
      - '.github/workflows/stdio-bridge-publish.yaml'
  workflow_dispatch:

concurrency:
  group: namazu-stdio-bridge-publish
  cancel-in-progress: false

jobs:

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: stdio-bridge
          push: true
          tags: |
            ghcr.io/namazustudios/namazu-stdio-bridge:latest
            ghcr.io/namazustudios/namazu-stdio-bridge:${{ github.sha }}
