name: Maven Central Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Perform a dry run (no commits, tags, or Maven Central deploy)'
        required: false
        default: 'false'

concurrency:
  group: conductor-integration
  cancel-in-progress: false

jobs:
  release:
    name: Publish Maven Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 and Maven Credentials
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Extract version info
        id: version
        run: |
          set -x
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            RELEASE_VERSION="${VERSION%-SNAPSHOT}"
          else
            RELEASE_VERSION="$VERSION"
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<<"$RELEASE_VERSION"
          NEXT_PATCH=$((PATCH+1))
          NEXT_VERSION="$MAJOR.$MINOR.$NEXT_PATCH-SNAPSHOT"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: Verify branch is in a SNAPSHOT state
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" != *-SNAPSHOT ]]; then
            echo "::error::Expected a -SNAPSHOT version on main, but found '$VERSION'."
            echo "The main branch must end with -SNAPSHOT before running a release."
            echo "Please bump the version in pom.xml (e.g. mvn versions:set -DnewVersion=X.Y.Z-SNAPSHOT) and push before retrying."
            exit 1
          fi

      - name: Show planned actions (dry run output)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "==== DRY RUN MODE ===="
          echo "Current version:    ${{ steps.version.outputs.version }}"
          echo "Release version:    ${{ steps.version.outputs.release_version }}"
          echo "Next snapshot:      ${{ steps.version.outputs.next_version }}"
          echo "Would run: mvn versions:set -DnewVersion=${{ steps.version.outputs.release_version }}"
          echo "Would tag: v${{ steps.version.outputs.release_version }}"
          echo "Would deploy to Maven Central"
          echo "Would create GitHub release"
          echo "Would bump to: ${{ steps.version.outputs.next_version }}"
          echo "No files or tags have been changed."

      - name: Prepare release version (real run)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -x
          mvn versions:set -DnewVersion=${{ steps.version.outputs.release_version }} -B --no-transfer-progress
          mvn versions:commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Release ${{ steps.version.outputs.release_version }}"
          git tag -a "v${{ steps.version.outputs.release_version }}" -m "Release ${{ steps.version.outputs.release_version }}"
          git push origin "${{ github.ref_name }}"
          git push origin "v${{ steps.version.outputs.release_version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish Release
        run: mvn -B --no-transfer-progress -Pcentral-publish clean deploy -pl '!:multiplay'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          EDGEGAP_API_KEY: ${{ secrets.EDGEGAP_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Create GitHub release
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.release_version }}
          name: Release ${{ steps.version.outputs.release_version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump to next snapshot version
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        run: |
          set -x
          mvn versions:set -DnewVersion=${{ steps.version.outputs.next_version }} -B --no-transfer-progress
          mvn versions:commit
          git commit -am "Start next iteration: ${{ steps.version.outputs.next_version }}"
          git push origin "${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate API documentation
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        run: mvn -B --no-transfer-progress dokka:dokka -Pdocs -N

      - name: Publish versioned docs to GitHub Pages
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        run: |
          set -e
          VERSION="${{ steps.version.outputs.release_version }}"
          REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clone gh-pages branch, or create it fresh if it doesn't exist yet
          if git ls-remote --exit-code --heads "$REMOTE_URL" gh-pages > /dev/null 2>&1; then
            git clone --branch gh-pages --depth 1 "$REMOTE_URL" /tmp/gh-pages
          else
            mkdir /tmp/gh-pages
            cd /tmp/gh-pages
            git init
            git remote add origin "$REMOTE_URL"
            git checkout --orphan gh-pages
            cd -
          fi

          # Deploy versioned docs
          rm -rf /tmp/gh-pages/$VERSION
          cp -r target/dokka/. /tmp/gh-pages/$VERSION/

          # Keep latest/ pointing to this release
          rm -rf /tmp/gh-pages/latest
          cp -r target/dokka/. /tmp/gh-pages/latest/

          # Generate root index listing all versions
          VERSIONS=$(cd /tmp/gh-pages && ls -d [0-9]*/ 2>/dev/null | sed 's|/||' | sort -rV)
          VERSION_ROWS=""
          for v in $VERSIONS; do
            VERSION_ROWS="${VERSION_ROWS}<tr><td><a href=\"${v}/\">${v}</a></td></tr>"
          done

          cat > /tmp/gh-pages/index.html << HTMLEOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Namazu Conductor API Documentation</title>
            <style>
              body { font-family: sans-serif; max-width: 640px; margin: 4rem auto; padding: 0 1rem; }
              h1 { font-size: 1.5rem; }
              a { color: #0969da; }
              table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
              td { padding: 0.5rem 0.75rem; border-bottom: 1px solid #d0d7de; }
              tr:first-child td { font-weight: bold; }
            </style>
          </head>
          <body>
            <h1>Namazu Conductor API Documentation</h1>
            <p><a href="latest/">Latest release</a></p>
            <h2>All Versions</h2>
            <table>${VERSION_ROWS}</table>
          </body>
          </html>
          HTMLEOF

          cd /tmp/gh-pages
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "API docs for v${VERSION}"
            git push origin gh-pages
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
