name: Maven Central Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Perform a dry run (no commits, tags, or Maven Central deploy)'
        required: false
        default: 'false'
      resume_from_build:
        description: 'Resume a release whose version bump/tag/commit already landed but the build+deploy step failed (skips re-bumping/re-tagging; uses the currently committed version as the release version)'
        required: false
        default: 'false'

concurrency:
  group: conductor-integration
  cancel-in-progress: false

jobs:
  release:
    name: Publish Maven Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 and Maven Credentials
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Extract version info
        id: version
        run: |
          set -x
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "${{ github.event.inputs.resume_from_build }}" == "true" ]]; then
            RELEASE_VERSION="$VERSION"
          elif [[ "$VERSION" == *-SNAPSHOT ]]; then
            RELEASE_VERSION="${VERSION%-SNAPSHOT}"
          else
            RELEASE_VERSION="$VERSION"
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<<"$RELEASE_VERSION"
          NEXT_PATCH=$((PATCH+1))
          NEXT_VERSION="$MAJOR.$MINOR.$NEXT_PATCH-SNAPSHOT"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: Verify branch is in a SNAPSHOT state
        if: ${{ github.event.inputs.resume_from_build != 'true' }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" != *-SNAPSHOT ]]; then
            echo "::error::Expected a -SNAPSHOT version on main, but found '$VERSION'."
            echo "The main branch must end with -SNAPSHOT before running a release."
            echo "Please bump the version in pom.xml (e.g. mvn versions:set -DnewVersion=X.Y.Z-SNAPSHOT) and push before retrying."
            exit 1
          fi

      # The build below skips integration tests (-DskipITs) rather than re-running the full
      # ECS/EdgeGap/Kubernetes suites a third time (PR CI and snapshot-publish.yaml's push-triggered
      # run already covered them for this exact code) — see snapshot-publish.yaml's own build step,
      # which does the same for the same reason. Since `main` has no branch-protection / required
      # status checks, this step is the only thing standing between that and releasing untested code,
      # so it must check the commit that was ACTUALLY snapshot-tested, not just `github.sha` blindly:
      # in `resume_from_build` mode, `github.sha` is the bot-authored "Release X.Y.Z" commit (pushed
      # with GITHUB_TOKEN, which does not trigger other workflows' `push` events), so its own
      # snapshot-publish run never exists — check its parent (the pre-bump commit that did get one).
      - name: Verify release commit already passed integration tests
        run: |
          set -e
          if [[ "${{ github.event.inputs.resume_from_build }}" == "true" ]]; then
            CHECK_SHA=$(git rev-parse HEAD~1)
            echo "resume_from_build=true — checking parent commit $CHECK_SHA (the pre-bump snapshot commit)"
          else
            CHECK_SHA="${{ github.sha }}"
            echo "Checking commit $CHECK_SHA"
          fi

          CONCLUSION=$(gh run list --workflow=snapshot-publish.yaml --commit "$CHECK_SHA" \
            --json conclusion,status --jq '[.[] | select(.status == "completed")][0].conclusion // "none"')

          if [[ "$CONCLUSION" != "success" ]]; then
            echo "::error::No successful 'Snapshot Build' run found for commit $CHECK_SHA (found: $CONCLUSION)."
            echo "Refusing to release untested code — wait for snapshot-publish.yaml to complete successfully for this commit before retrying."
            exit 1
          fi

          echo "Found a successful Snapshot Build run for $CHECK_SHA — proceeding."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show planned actions (dry run output)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "==== DRY RUN MODE ===="
          echo "Current version:    ${{ steps.version.outputs.version }}"
          echo "Release version:    ${{ steps.version.outputs.release_version }}"
          echo "Next snapshot:      ${{ steps.version.outputs.next_version }}"
          echo "Would run: mvn versions:set -DnewVersion=${{ steps.version.outputs.release_version }}"
          echo "Would tag: v${{ steps.version.outputs.release_version }}"
          echo "Would deploy to Maven Central"
          echo "Would create GitHub release"
          echo "Would bump to: ${{ steps.version.outputs.next_version }}"
          echo "No files or tags have been changed."

      - name: Prepare release version (real run)
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.resume_from_build != 'true' }}
        run: |
          set -x
          mvn versions:set -DnewVersion=${{ steps.version.outputs.release_version }} -B --no-transfer-progress
          mvn versions:commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Release ${{ steps.version.outputs.release_version }}"
          git tag -a "v${{ steps.version.outputs.release_version }}" -m "Release ${{ steps.version.outputs.release_version }}"
          git push origin "${{ github.ref_name }}"
          git push origin "v${{ steps.version.outputs.release_version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Integration tests are intentionally skipped here (-DskipITs) — see the "Verify release
      # commit already passed integration tests" step above for why that's safe.
      - name: Build and Publish Release
        run: mvn -B --no-transfer-progress -Pcentral-publish clean deploy -pl '!:multiplay' -DskipITs
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}

      - name: Create GitHub release
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.release_version }}
          name: Release ${{ steps.version.outputs.release_version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump to next snapshot version
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        run: |
          set -x
          mvn versions:set -DnewVersion=${{ steps.version.outputs.next_version }} -B --no-transfer-progress
          mvn versions:commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Start next iteration: ${{ steps.version.outputs.next_version }}"
          git push origin "${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate API documentation
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        run: mvn -B --no-transfer-progress dokka:dokka -Pdocs -N

      - name: Apply brand styling to API documentation
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        run: ./dokka/apply-branding.sh target/dokka

      - name: Configure AWS credentials
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APIDOCS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Publish versioned docs to S3
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        run: |
          set -e
          VERSION="${{ steps.version.outputs.release_version }}"
          aws s3 sync target/dokka/ "s3://namazu-apidocs/namazu-conductor/${VERSION}/" --delete
          aws s3 sync target/dokka/ "s3://namazu-apidocs/namazu-conductor/latest/" --delete
