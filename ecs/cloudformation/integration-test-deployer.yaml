AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Namazu Conductor - ECS integration test deployer.
  Creates an IAM user with the minimum permissions required to deploy and
  tear down the integration-test.yaml stack. Deploy this stack first, then
  use its outputs to deploy integration-test.yaml.

Parameters:

  IntegrationTestStackName:
    Type: String
    Default: conductor-integration-test
    Description: >
      The name that will be given to the integration-test.yaml stack. Used to
      scope CloudFormation and IAM resource permissions to that stack only.

Resources:

  # Persistent ECR repository for the integration test image. Lives in the
  # deployer stack rather than the integration-test stack so it survives
  # create/destroy cycles and image layers remain cached between test runs.
  IntegrationTestRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: conductor-integration-test
      ImageScanningConfiguration:
        ScanOnPush: true
      Tags:
        - Key: Name
          Value: conductor-integration-test

  DeployerUser:
    Type: AWS::IAM::User
    Properties:
      UserName: conductor-integration-test-deployer
      Tags:
        - Key: Name
          Value: conductor-integration-test-deployer

  DeployerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: conductor-integration-test-deployer
      Users:
        - !Ref DeployerUser
      PolicyDocument:
        Version: '2012-10-17'
        Statement:

          # ------------------------------------------------------------------
          # CloudFormation - scoped to the integration test stack only.
          # ValidateTemplate has no resource scope in the IAM model.
          # ------------------------------------------------------------------
          - Sid: CloudFormationStack
            Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:DeleteStack
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResources
              - cloudformation:GetTemplate
              - cloudformation:GetTemplateSummary
            Resource:
              - !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:stack/${IntegrationTestStackName}/*'
              - !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:stack/${AWS::StackName}/*'

          - Sid: CloudFormationValidate
            Effect: Allow
            Action:
              - cloudformation:ValidateTemplate
            Resource: '*'

          # ------------------------------------------------------------------
          # SSM - read ECS-optimized AMI ID from the public AWS SSM path.
          # The parameter is owned by AWS (no account ID in the ARN).
          # ------------------------------------------------------------------
          - Sid: SsmGetEcsAmi
            Effect: Allow
            Action:
              - ssm:GetParameters
            Resource:
              - 'arn:aws:ssm:*::parameter/aws/service/ecs/*'

          # ------------------------------------------------------------------
          # EC2 - VPC, subnets, IGW, route tables, security groups.
          # Most EC2 networking actions do not support resource-level
          # restrictions and require Resource: '*'.
          # ------------------------------------------------------------------
          - Sid: Ec2Networking
            Effect: Allow
            Action:
              - ec2:DescribeAvailabilityZones
              - ec2:DescribeVpcs
              - ec2:CreateVpc
              - ec2:DeleteVpc
              - ec2:ModifyVpcAttribute
              - ec2:DescribeInternetGateways
              - ec2:CreateInternetGateway
              - ec2:DeleteInternetGateway
              - ec2:AttachInternetGateway
              - ec2:DetachInternetGateway
              - ec2:DescribeSubnets
              - ec2:CreateSubnet
              - ec2:DeleteSubnet
              - ec2:ModifySubnetAttribute
              - ec2:DescribeRouteTables
              - ec2:CreateRouteTable
              - ec2:DeleteRouteTable
              - ec2:CreateRoute
              - ec2:DeleteRoute
              - ec2:AssociateRouteTable
              - ec2:DisassociateRouteTable
              - ec2:DescribeSecurityGroups
              - ec2:CreateSecurityGroup
              - ec2:DeleteSecurityGroup
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:RevokeSecurityGroupIngress
              - ec2:RevokeSecurityGroupEgress
              - ec2:CreateTags
              - ec2:DeleteTags
              - ec2:DescribeImages
            Resource: '*'

          # ------------------------------------------------------------------
          # ECS - cluster, task definitions, and capacity providers.
          # ------------------------------------------------------------------
          - Sid: EcsClusterAndTaskDefinition
            Effect: Allow
            Action:
              - ecs:CreateCluster
              - ecs:DeleteCluster
              - ecs:DescribeClusters
              - ecs:RegisterTaskDefinition
              - ecs:DeregisterTaskDefinition
              - ecs:DescribeTaskDefinition
              - ecs:CreateCapacityProvider
              - ecs:DeleteCapacityProvider
              - ecs:DescribeCapacityProviders
              - ecs:PutClusterCapacityProviders
              - ecs:TagResource
              - ecs:UntagResource
              - ecs:ListTagsForResource
            Resource: '*'

          # ------------------------------------------------------------------
          # EC2 - launch templates for the spot ASG.
          # ------------------------------------------------------------------
          - Sid: Ec2LaunchTemplate
            Effect: Allow
            Action:
              - ec2:CreateLaunchTemplate
              - ec2:DeleteLaunchTemplate
              - ec2:DescribeLaunchTemplates
              - ec2:DescribeLaunchTemplateVersions
              - ec2:ModifyLaunchTemplate
            Resource: '*'

          # AutoScaling requires ec2:RunInstances on the launch template resource
          # (and associated resources) to authorise use of the template when
          # creating an ASG. Without this you get "not authorized to use
          # launch template" even though AutoScaling itself launches instances.
          - Sid: Ec2RunInstancesForAsg
            Effect: Allow
            Action:
              - ec2:RunInstances
            Resource: '*'

          # ------------------------------------------------------------------
          # AutoScaling - spot ASG for ECS EC2 capacity.
          # ------------------------------------------------------------------
          - Sid: AutoScaling
            Effect: Allow
            Action:
              - autoscaling:CreateAutoScalingGroup
              - autoscaling:UpdateAutoScalingGroup
              - autoscaling:DeleteAutoScalingGroup
              - autoscaling:DescribeAutoScalingGroups
              - autoscaling:DescribeAutoScalingInstances
              - autoscaling:DescribeScalingActivities
              - autoscaling:DescribePolicies
              - autoscaling:DescribeLaunchConfigurations
              - autoscaling:SetDesiredCapacity
              - autoscaling:TerminateInstanceInAutoScalingGroup
              - autoscaling:EnableMetricsCollection
              - autoscaling:DisableMetricsCollection
              - autoscaling:CreateOrUpdateTags
              - autoscaling:DeleteTags
            Resource: '*'

          # ------------------------------------------------------------------
          # IAM - scoped to resources whose names match the stack prefix.
          # The deployer creates the task execution role, the integration test
          # user, and its inline policy and access key.
          # ------------------------------------------------------------------
          - Sid: IamRole
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:TagRole
              - iam:UntagRole
            Resource:
              - !Sub 'arn:aws:iam::${AWS::AccountId}:role/conductor-integration-test*'

          # ECS and AutoScaling create service-linked roles on first use in an
          # account. CloudFormation triggers this automatically; the deployer
          # user needs permission to initiate the creation.
          - Sid: IamCreateServiceLinkedRole
            Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource:
              - 'arn:aws:iam::*:role/aws-service-role/ecs.amazonaws.com/*'
              - 'arn:aws:iam::*:role/aws-service-role/autoscaling.amazonaws.com/*'

          - Sid: IamInstanceProfile
            Effect: Allow
            Action:
              - iam:CreateInstanceProfile
              - iam:DeleteInstanceProfile
              - iam:GetInstanceProfile
              - iam:AddRoleToInstanceProfile
              - iam:RemoveRoleFromInstanceProfile
              - iam:TagInstanceProfile
              - iam:UntagInstanceProfile
            Resource:
              - !Sub 'arn:aws:iam::${AWS::AccountId}:instance-profile/conductor-integration-test*'

          - Sid: IamUser
            Effect: Allow
            Action:
              - iam:CreateUser
              - iam:DeleteUser
              - iam:GetUser
              - iam:TagUser
              - iam:UntagUser
              - iam:PutUserPolicy
              - iam:DeleteUserPolicy
              - iam:GetUserPolicy
              - iam:CreateAccessKey
              - iam:DeleteAccessKey
              - iam:ListAccessKeys
            Resource:
              - !Sub 'arn:aws:iam::${AWS::AccountId}:user/conductor-integration-test*'

          # Required for CloudFormation to pass the task execution role to ECS
          # when registering the task definition.
          - Sid: IamPassTaskExecutionRole
            Effect: Allow
            Action:
              - iam:PassRole
            Resource:
              - !Sub 'arn:aws:iam::${AWS::AccountId}:role/conductor-integration-test*'

          # ------------------------------------------------------------------
          # ECR - push access to the integration test repository.
          # GetAuthorizationToken has no resource scope in the IAM model.
          # ------------------------------------------------------------------
          - Sid: EcrGetAuthToken
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource: '*'

          - Sid: EcrPush
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:PutImage
              - ecr:DescribeRepositories
              - ecr:DescribeImages
            Resource:
              - !GetAtt IntegrationTestRepository.Arn

          # ------------------------------------------------------------------
          # CloudWatch Logs - scoped to the integration test log group.
          # ------------------------------------------------------------------
          - Sid: Logs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:DescribeLogGroups
              - logs:PutRetentionPolicy
              - logs:DeleteRetentionPolicy
              - logs:TagResource
              - logs:UntagResource
              - logs:ListTagsForResource
            Resource:
              - !Sub 'arn:aws:logs:*:${AWS::AccountId}:log-group:/ecs/conductor-integration-test*'
              - !Sub 'arn:aws:logs:*:${AWS::AccountId}:log-group:/ecs/conductor-integration-test*:*'

  DeployerAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref DeployerUser

  DeployerSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: conductor-integration-test-deployer
      Description: AWS credentials for the Conductor ECS integration test deployer user
      SecretString: !Sub |
        {
          "AWS_ACCESS_KEY_ID": "${DeployerAccessKey}",
          "AWS_SECRET_ACCESS_KEY": "${DeployerAccessKey.SecretAccessKey}"
        }
      Tags:
        - Key: Name
          Value: conductor-integration-test-deployer

Outputs:

  DeployerSecretArn:
    Description: Secrets Manager ARN containing the deployer AWS credentials
    Value: !Ref DeployerSecret

  EcrRepositoryUri:
    Description: ECR repository URI - use as the image base for docker build/push
    Value: !GetAtt IntegrationTestRepository.RepositoryUri

  AwsAccessKeyId:
    Description: AWS_ACCESS_KEY_ID for the deployer user
    Value: !Ref DeployerAccessKey

  AwsSecretAccessKey:
    Description: AWS_SECRET_ACCESS_KEY - only visible now, not retrievable later
    Value: !GetAtt DeployerAccessKey.SecretAccessKey

  DeployCommand:
    Description: Command to deploy the integration-test.yaml stack
    Value: !Sub >-
      AWS_ACCESS_KEY_ID=${DeployerAccessKey}
      AWS_SECRET_ACCESS_KEY=${DeployerAccessKey.SecretAccessKey}
      aws cloudformation deploy
      --template-file integration-test.yaml
      --stack-name ${IntegrationTestStackName}
      --capabilities CAPABILITY_NAMED_IAM
      --region <region>