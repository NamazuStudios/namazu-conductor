AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Namazu Conductor - ECS integration test infrastructure.
  Creates a VPC, public subnet, ECS cluster, nginx task definition tagged for
  Conductor, and an IAM user with the minimum permissions required to run
  EcsOrchestrationServiceIT.

Parameters:

  VpcCidr:
    Type: String
    Default: '10.0.0.0/16'
    Description: CIDR block for the VPC created for integration testing.

  SubnetCidr:
    Type: String
    Default: '10.0.1.0/24'
    Description: CIDR block for the public subnet. Must fall within VpcCidr.

  TaskFamily:
    Type: String
    Default: conductor-integration-test
    Description: >
      ECS task definition family name. Must match the ECS_TASK_FAMILY environment
      variable used when running the integration test (defaults to
      conductor-integration-test if that variable is unset).

  RepositoryUrl:
    Type: String
    Description: >
      Container registry URL, e.g.
      123456789012.dkr.ecr.us-east-1.amazonaws.com.
      The task image is resolved as {RepositoryUrl}/{ImageName}.

  ImageName:
    Type: String
    Default: 'conductor-integration-test:latest'
    Description: >
      Image name and tag within RepositoryUrl, e.g. conductor-integration-test:latest.

  Ec2TaskFamily:
    Type: String
    Default: conductor-integration-test-ec2
    Description: >
      ECS task definition family name for the EC2 spot-backed task.

  DaemonTaskFamily:
    Type: String
    Default: conductor-integration-test-daemon
    Description: >
      ECS task definition family name for the daemon (ECS Service) task, exercised by
      DaemonOrchestrationService integration tests.

  EcsOptimizedAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2/recommended/image_id
    Description: >
      ECS-optimized Amazon Linux 2 AMI, resolved from SSM at deploy time.

# ---------------------------------------------------------------------------
# Networking
# ---------------------------------------------------------------------------
Resources:

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: conductor-integration-test

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: conductor-integration-test

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref SubnetCidr
      # Use the first AZ in the region - avoids the need for a parameter.
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      MapPublicIpOnLaunch: false   # Conductor controls this via namazu.conductor:assignPublicIp
      Tags:
        - Key: Name
          Value: conductor-integration-test-public

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: conductor-integration-test-public

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # Allows inbound HTTP from anywhere and all outbound traffic. Outbound is
  # required for Fargate to pull the nginx image from Docker Hub.
  IntegrationTestSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Conductor integration test - allows inbound TCP 80
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: '0.0.0.0/0'
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: '0.0.0.0/0'
      Tags:
        - Key: Name
          Value: conductor-integration-test

# ---------------------------------------------------------------------------
# ECS
# ---------------------------------------------------------------------------

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: conductor-integration-test
      Tags:
        - Key: Name
          Value: conductor-integration-test

  # Allows ECS to pull container images and write CloudWatch logs on behalf of
  # the task. The AWS-managed policy covers Docker Hub and ECR public access.
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: conductor-integration-test-task-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Name
          Value: conductor-integration-test-task-execution

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${TaskFamily}'
      RetentionInDays: 7

  # The task definition is tagged with the namazu.conductor:jobSet,
  # namazu.conductor:launchType, and namazu.conductor:assignPublicIp tags that
  # EcsOrchestrationService reads at profile-discovery time. The jobset tag
  # must match the conductor's configured jobset attribute (default: "default")
  # or the task definition will be excluded from profile discovery.
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref TaskFamily
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: nginx
          Image: !Sub '${RepositoryUrl}/${ImageName}'
          PortMappings:
            - ContainerPort: 80
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
      Tags:
        - Key: namazu.conductor:jobSet
          Value: default
        - Key: namazu.conductor:launchType
          Value: FARGATE
        - Key: namazu.conductor:assignPublicIp
          Value: ENABLED

  DaemonLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${DaemonTaskFamily}'
      RetentionInDays: 7

  # Backs DaemonOrchestrationService integration tests — deployed via CreateService rather than
  # RunTask, so it's tagged workloadKind=daemon to keep it out of getAvailableProfiles()/RunTask-based
  # job discovery entirely. Reuses the same Fargate/awsvpc shape and test image as TaskDefinition.
  DaemonTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref DaemonTaskFamily
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: nginx
          Image: !Sub '${RepositoryUrl}/${ImageName}'
          PortMappings:
            - ContainerPort: 80
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref DaemonLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
      Tags:
        - Key: namazu.conductor:jobSet
          Value: default
        - Key: namazu.conductor:workloadKind
          Value: daemon
        - Key: namazu.conductor:launchType
          Value: FARGATE
        - Key: namazu.conductor:assignPublicIp
          Value: ENABLED
        - Key: namazu.conductor:desiredCount
          Value: '1'

# ---------------------------------------------------------------------------
# EC2 spot-backed capacity
# ---------------------------------------------------------------------------

  # IAM role assumed by EC2 container instances so the ECS agent can register
  # with the cluster and pull task images from ECR.
  Ec2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: conductor-integration-test-ec2-instance
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Name
          Value: conductor-integration-test-ec2-instance

  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: conductor-integration-test-ec2-instance
      Roles:
        - !Ref Ec2InstanceRole

  # Spot launch template — t3.small, ECS-optimized AMI, public IP enabled so
  # the IT test can reach the container over HTTP.
  Ec2LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: conductor-integration-test
      LaunchTemplateData:
        ImageId: !Ref EcsOptimizedAmi
        InstanceType: t3.small
        IamInstanceProfile:
          Arn: !GetAtt Ec2InstanceProfile.Arn
        InstanceMarketOptions:
          MarketType: spot
          SpotOptions:
            SpotInstanceType: one-time
            InstanceInterruptionBehavior: terminate
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: true
            Groups:
              - !Ref IntegrationTestSecurityGroup
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            echo ECS_CLUSTER=${Cluster} >> /etc/ecs/ecs.config
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: conductor-integration-test

  Ec2AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: VpcGatewayAttachment
    Properties:
      AutoScalingGroupName: conductor-integration-test
      MinSize: '1'
      MaxSize: '2'
      DesiredCapacity: '1'
      LaunchTemplate:
        LaunchTemplateId: !Ref Ec2LaunchTemplate
        Version: !GetAtt Ec2LaunchTemplate.LatestVersionNumber
      VPCZoneIdentifier:
        - !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: conductor-integration-test
          PropagateAtLaunch: true

  Ec2CapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Properties:
      Name: conductor-integration-test
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref Ec2AutoScalingGroup
        ManagedScaling:
          Status: ENABLED
          TargetCapacity: 100
        ManagedTerminationProtection: DISABLED
      Tags:
        - Key: Name
          Value: conductor-integration-test

  ClusterCapacityProviderAssociations:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !Ref Cluster
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
        - !Ref Ec2CapacityProvider
      DefaultCapacityProviderStrategy: []

  Ec2LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${Ec2TaskFamily}'
      RetentionInDays: 7

  # EC2/bridge task definition. Runs on the spot ASG instances. Uses bridge
  # network mode so the container port maps directly to port 80 on the host.
  Ec2TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref Ec2TaskFamily
      NetworkMode: bridge
      RequiresCompatibilities:
        - EC2
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: nginx
          Image: !Sub '${RepositoryUrl}/${ImageName}'
          Memory: 256
          PortMappings:
            - ContainerPort: 80
              HostPort: 80
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Ec2LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
      Tags:
        - Key: namazu.conductor:jobSet
          Value: default
        - Key: namazu.conductor:launchType
          Value: EC2

# ---------------------------------------------------------------------------
# IAM user for running the integration test
# ---------------------------------------------------------------------------

  IntegrationTestUser:
    Type: AWS::IAM::User
    Properties:
      UserName: conductor-integration-test
      Tags:
        - Key: Name
          Value: conductor-integration-test

  IntegrationTestUserPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: conductor-integration-test
      Users:
        - !Ref IntegrationTestUser
      PolicyDocument:
        Version: '2012-10-17'
        Statement:

          # Profile discovery - getAvailableProfiles()
          - Sid: EcsListAndDescribeTaskDefinitions
            Effect: Allow
            Action:
              - ecs:ListTaskDefinitionFamilies
              - ecs:DescribeTaskDefinition
            Resource: '*'

          # Task execution - execute()
          # Resource covers both Fargate and EC2 task definitions; cluster
          # enforced via condition.
          - Sid: EcsRunTask
            Effect: Allow
            Action:
              - ecs:RunTask
            Resource:
              - !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${TaskFamily}:*'
              - !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${Ec2TaskFamily}:*'
            Condition:
              ArnEquals:
                ecs:cluster: !GetAtt Cluster.Arn

          # Required so RunTask can pass the execution role to the task
          - Sid: IamPassTaskExecutionRole
            Effect: Allow
            Action:
              - iam:PassRole
            Resource: !GetAtt TaskExecutionRole.Arn

          # Status polling - getFutureForStatus()
          - Sid: EcsDescribeTasks
            Effect: Allow
            Action:
              - ecs:DescribeTasks
            Resource: '*'
            Condition:
              ArnEquals:
                ecs:cluster: !GetAtt Cluster.Arn

          # Teardown - stop()
          - Sid: EcsStopTask
            Effect: Allow
            Action:
              - ecs:StopTask
            Resource: '*'
            Condition:
              ArnEquals:
                ecs:cluster: !GetAtt Cluster.Arn

          # Daemon deployment - deploy()/setDesiredCount()/undeploy()/getStatus()
          - Sid: EcsManageServices
            Effect: Allow
            Action:
              - ecs:CreateService
              - ecs:UpdateService
              - ecs:DeleteService
              - ecs:DescribeServices
            Resource: '*'
            Condition:
              ArnEquals:
                ecs:cluster: !GetAtt Cluster.Arn

          # Daemon autoscaling - setScalingBounds()/undeploy()/getStatus()
          # Application Auto Scaling does not support ARN-scoped resource conditions.
          - Sid: ApplicationAutoScalingManageEcsTargets
            Effect: Allow
            Action:
              - application-autoscaling:RegisterScalableTarget
              - application-autoscaling:DeregisterScalableTarget
              - application-autoscaling:DescribeScalableTargets
            Resource: '*'

          # One-time per-account: Application Auto Scaling needs this to create its own
          # service-linked role on the first ever RegisterScalableTarget call in the account.
          - Sid: IamCreateApplicationAutoScalingServiceLinkedRole
            Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService'
            Condition:
              StringEquals:
                iam:AWSServiceName: ecs.application-autoscaling.amazonaws.com

          # Public IP lookup for awsvpc tasks - resolveAwsVpcHost()
          - Sid: Ec2DescribeNetworkInterfaces
            Effect: Allow
            Action:
              - ec2:DescribeNetworkInterfaces
            Resource: '*'

          # Public IP lookup for EC2/bridge tasks - resolveContainerInstanceHost()
          - Sid: EcsDescribeContainerInstances
            Effect: Allow
            Action:
              - ecs:DescribeContainerInstances
            Resource: '*'
            Condition:
              ArnEquals:
                ecs:cluster: !GetAtt Cluster.Arn

          - Sid: Ec2DescribeInstances
            Effect: Allow
            Action:
              - ec2:DescribeInstances
            Resource: '*'

          # ECR pull - required to verify the image exists and for any direct
          # ECR calls from the test; task image pull itself is handled by the
          # task execution role via AmazonECSTaskExecutionRolePolicy.
          - Sid: EcrPull
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource: '*'
          - Sid: EcrPullRepository
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
            Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/conductor-integration-test'

  # The secret access key is only retrievable at stack creation time.
  # Retrieve it from the stack Outputs immediately after deployment.
  IntegrationTestAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref IntegrationTestUser

# ---------------------------------------------------------------------------
# Outputs - copy these directly into your environment for mvn verify
# ---------------------------------------------------------------------------
Outputs:

  AwsRegion:
    Description: AWS_REGION
    Value: !Ref AWS::Region

  EcsCluster:
    Description: ECS_CLUSTER
    Value: !Ref Cluster

  EcsSubnets:
    Description: ECS_SUBNETS
    Value: !Ref PublicSubnet

  EcsSecurityGroups:
    Description: ECS_SECURITY_GROUPS
    Value: !Ref IntegrationTestSecurityGroup

  EcsTaskFamily:
    Description: ECS_TASK_FAMILY (only needed if overriding the default)
    Value: !Ref TaskFamily

  EcsEc2TaskFamily:
    Description: EC2 spot task definition family
    Value: !Ref Ec2TaskFamily

  EcsDaemonTaskFamily:
    Description: Daemon (ECS Service) task definition family
    Value: !Ref DaemonTaskFamily

  AwsAccessKeyId:
    Description: AWS_ACCESS_KEY_ID
    Value: !Ref IntegrationTestAccessKey

  AwsSecretAccessKey:
    Description: AWS_SECRET_ACCESS_KEY - only visible now, not retrievable later
    Value: !GetAtt IntegrationTestAccessKey.SecretAccessKey

  ImageUri:
    Description: Full image URI used by the task definition
    Value: !Sub '${RepositoryUrl}/${ImageName}'
